<svg width="960" height="1076" viewBox="0 0 960 1076" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chassis-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191e19"/>
      <stop offset="100%" stop-color="#0f120f"/>
    </linearGradient>

    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5d6a5d"/>
      <stop offset="50%" stop-color="#4e594e"/>
      <stop offset="100%" stop-color="#3e473e"/>
    </linearGradient>

    <linearGradient id="panel-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <g id="screw">
      <circle cx="0" cy="0" r="6" fill="#232923" stroke="#111411" stroke-width="1"/>
      <circle cx="0" cy="0" r="4.5" fill="#3b443b"/>
      <line x1="-2.5" y1="0" x2="2.5" y2="0" stroke="#141814" stroke-width="1.2"/>
      <line x1="0" y1="-2.5" x2="0" y2="2.5" stroke="#141814" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- Chassis -->
  <rect x="0" y="0" width="960" height="1076" fill="url(#chassis-bg)"/>
  <rect x="6" y="6" width="948" height="1064" rx="4" fill="none" stroke="#2d352d" stroke-width="2"/>
  <use href="#screw" x="20" y="20"/><use href="#screw" x="940" y="20"/>
  <use href="#screw" x="20" y="1056"/><use href="#screw" x="940" y="1056"/>

  <!-- Upper plate: noise layers -->
  <rect x="16" y="20" width="928" height="250" rx="4" fill="url(#panel-grad)" stroke="#242b24" stroke-width="2"/>
  <rect x="17" y="21" width="926" height="248" rx="4" fill="url(#panel-sheen)"/>
  <use href="#screw" x="30" y="34"/><use href="#screw" x="930" y="34"/>
  <use href="#screw" x="30" y="256"/><use href="#screw" x="930" y="256"/>

  <!-- Middle plate: effects -->
  <rect x="16" y="282" width="928" height="412" rx="4" fill="url(#panel-grad)" stroke="#242b24" stroke-width="2"/>
  <rect x="17" y="283" width="926" height="410" rx="4" fill="url(#panel-sheen)"/>
  <use href="#screw" x="30" y="296"/><use href="#screw" x="930" y="296"/>
  <use href="#screw" x="30" y="680"/><use href="#screw" x="930" y="680"/>

  <!-- Lower plate: gate -->
  <rect x="16" y="706" width="928" height="354" rx="4" fill="url(#panel-grad)" stroke="#242b24" stroke-width="2"/>
  <rect x="17" y="707" width="926" height="352" rx="4" fill="url(#panel-sheen)"/>
  <use href="#screw" x="30" y="720"/><use href="#screw" x="930" y="720"/>
  <use href="#screw" x="30" y="1046"/><use href="#screw" x="930" y="1046"/>
</svg>