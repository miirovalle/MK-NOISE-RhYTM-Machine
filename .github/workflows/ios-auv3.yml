name: iOS AUv3

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: iOS deployment target
        type: string
        default: "17.0"
      signed:
        description: Build a signed IPA (requires the Apple secrets documented in README.md)
        type: boolean
        default: false
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "Source/**"
      - "Tests/**"
      - "ThirdParty/**"
      - "analog_plugin_svgs/**"
      - ".github/workflows/ios-auv3.yml"

permissions:
  contents: write

concurrency:
  group: ios-auv3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: AUv3 + IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BUILD_DIR: build-ios
      DEPLOYMENT_TARGET: ${{ inputs.deployment_target || '17.0' }}
      TARGET_NAME: MKNoiseRhythmMachine
      APP_NAME: MK NOISE RhYTM Machine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          cmake --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Detect signing material
        id: signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          WANT_SIGNED: ${{ inputs.signed }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          if [ "${WANT_SIGNED}" != "true" ] && [ "${IS_TAG}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${TEAM_ID}" ] || [ -z "${CERT}" ] || [ -z "${API_KEY}" ]; then
            if [ "${WANT_SIGNED}" = "true" ]; then
              echo "::error::A signed build was requested, but APPLE_TEAM_ID, APPLE_CERT_P12_BASE64 and APPLE_API_KEY_P8_BASE64 are not all configured."
              exit 1
            fi
            echo "Signing secrets are not configured; producing an unsigned IPA."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Import signing identity
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERT_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          echo "$API_KEY" | base64 --decode > "${RUNNER_TEMP}/AuthKey.p8"
          rm -f "${RUNNER_TEMP}/cert.p12"

      - name: Configure (Xcode, iOS)
        run: |
          set -euo pipefail
          cmake -S . -B "$BUILD_DIR" -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_TESTING=OFF \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON

      - name: Build AUv3 + host app (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          set -euo pipefail
          xcodebuild -project "$BUILD_DIR/$TARGET_NAME.xcodeproj" \
            -target "${TARGET_NAME}_Standalone" -configuration Release -sdk iphoneos \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build

      - name: Build AUv3 + host app (signed)
        if: steps.signing.outputs.enabled == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project "$BUILD_DIR/$TARGET_NAME.xcodeproj" \
            -target "${TARGET_NAME}_Standalone" -configuration Release -sdk iphoneos \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            -quiet build

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | cut -d' ' -f2)"
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then SUFFIX=""; else SUFFIX="-unsigned"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          APP="$(find "$BUILD_DIR" -type d -name "$APP_NAME.app" | head -n1)"
          if [ -z "$APP" ]; then
            echo "::error::The build produced no $APP_NAME.app container app."
            find "$BUILD_DIR" -maxdepth 3 \( -type d -name '*.app' -o -type d -name '*.appex' \) -print
            exit 1
          fi

          APPEX="$(find "$APP" -type d -name '*.appex' | head -n1)"
          if [ -z "$APPEX" ]; then
            echo "::error::The AUv3 app extension is not embedded in the container app."
            exit 1
          fi

          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          lipo -info "$APP/$EXE"
          echo "Embedded extension: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist")"

          mkdir -p out Payload
          cp -R "$APP" Payload/
          xattr -cr Payload || true
          zip -qry -X "out/MK-NOISE-RhYTM-Machine-${VERSION}-ios${SUFFIX}.ipa" Payload
          ditto -c -k --keepParent "$APPEX" "out/MK-NOISE-RhYTM-Machine-${VERSION}-AUv3${SUFFIX}.appex.zip"
          cp ThirdParty/Gate12/LICENSE "out/Gate12-LICENSE.txt"
          rm -rf Payload
          ls -lh out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MK-NOISE-RhYTM-Machine-${{ steps.package.outputs.version }}-ios
          path: out/*
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Automated iOS AUv3 + IPA build."
          gh release upload "$TAG" out/*.ipa out/*.zip --clobber
